name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  artifacts:
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Syft and Cosign
        run: |
          curl -fsSL -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz
          echo "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign /usr/local/bin/syft
      - name: Build images
        run: |
          docker build -t pay-app:ci .
          docker build -f Dockerfile.wallet -t pay-wallet-rpc:ci .
      - name: Generate SBOMs
        run: |
          syft pay-app:ci -o spdx-json=app.spdx.json
          syft pay-wallet-rpc:ci -o spdx-json=wallet.spdx.json
      - name: Sign SBOMs
        env:
          COSIGN_EXPERIMENTAL: "1"
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign sign-blob --yes --bundle app.bundle app.spdx.json
          cosign sign-blob --yes --bundle wallet.bundle wallet.spdx.json
          cosign verify-blob --bundle app.bundle \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" app.spdx.json
          cosign verify-blob --bundle wallet.bundle \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" wallet.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            app.spdx.json
            app.bundle
            wallet.spdx.json
            wallet.bundle

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate test environment
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          PAYMENT_API_KEY="$(openssl rand -hex 24)"
          CRON_SECRET="$(openssl rand -hex 24)"
          echo "PAYMENT_API_KEY=${PAYMENT_API_KEY}" >> "$GITHUB_ENV"
          echo "CRON_SECRET=${CRON_SECRET}" >> "$GITHUB_ENV"
          cat > .env <<EOF
          COMPOSE_PROFILES=prod
          POSTGRES_USER=pay
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=pay
          DATABASE_URL=postgresql://pay:${POSTGRES_PASSWORD}@db:5432/pay?schema=public
          SESSION_SECRET=$(openssl rand -hex 32)
          WALLET_ENCRYPTION_KEY=$(openssl rand -hex 32)
          MONERO_RPC_USER=monero
          MONERO_RPC_PASSWORD=$(openssl rand -hex 24)
          MONERO_WALLET_PASSWORD=$(openssl rand -hex 24)
          MONERO_NETWORK=stagenet
          MONERO_DAEMON_ADDRESS=xmr-lux.boldsuck.org:38081
          SINGLE_USER_EMAIL=ci@example.com
          SINGLE_USER_PASSWORD=ci-password-at-least-12
          PAYMENT_API_KEY=${PAYMENT_API_KEY}
          CRON_SECRET=${CRON_SECRET}
          NEXT_TELEMETRY_DISABLED=1
          DO_NOT_TRACK=1
          EOF
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 5
          done
          exit 1
      - name: Configure test wallet
        run: |
          curl -fsS --max-time 30 -c /tmp/pay-cookie -X POST http://localhost:3000/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-at-least-12"}'
          curl -fsS --max-time 90 -b /tmp/pay-cookie -X POST http://localhost:3000/api/wallet/setup \
            -H 'content-type: application/json' \
            -d '{"address":"55LUf1D3VW2bTJ58jQK2bTYCV15pSGozMbTGscJrVfS5aW1AXQAvmbtJBHd7HzS8eSBSt4vJTsZ799g4GtSdDfFZGh9KCBd","viewKey":"90c6b30bb49fd5305cd6ff0e27a132a18fe79e9a20a6841e7558126ab476f80c"}'
      - name: Run integration smoke test
        run: npm run test:integration
        env:
          APP_URL: http://localhost:3000
          SINGLE_USER_EMAIL: ci@example.com
          SINGLE_USER_PASSWORD: ci-password-at-least-12
          PAYMENT_API_KEY: ${{ env.PAYMENT_API_KEY }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
      - name: Stop stack
        if: always()
        run: docker compose down -v

  checks:
    needs: [unit, artifacts, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks and artifacts succeeded"
