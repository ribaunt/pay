services:
  db:
    profiles: ["prod"]
    image: postgres@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay} -d ${POSTGRES_DB:-pay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production profile: COMPOSE_PROFILES=prod
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      wallet-rpc:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pay}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-pay}?schema=public
      MONERO_WALLET_RPC_URL: http://wallet-rpc:18082
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:?set MONERO_WALLET_PASSWORD in .env}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:?set WALLET_ENCRYPTION_KEY in .env}
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_MODE: ${MONERO_DAEMON_MODE:-full-scan}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_DAEMON_FALLBACKS: ${MONERO_DAEMON_FALLBACKS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:?set SINGLE_USER_EMAIL in .env}
      SINGLE_USER_PASSWORD: ${SINGLE_USER_PASSWORD:?set SINGLE_USER_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      PAYMENT_DEFAULT_TIMEOUT_SECONDS: ${PAYMENT_DEFAULT_TIMEOUT_SECONDS:-1800}
      PAYMENT_MIN_TIMEOUT_SECONDS: ${PAYMENT_MIN_TIMEOUT_SECONDS:-60}
      PAYMENT_MAX_TIMEOUT_SECONDS: ${PAYMENT_MAX_TIMEOUT_SECONDS:-86400}
      PAYMENT_REQUIRED_CONFIRMATIONS: ${PAYMENT_REQUIRED_CONFIRMATIONS:-10}
      PRICE_CACHE_TTL_SECONDS: ${PRICE_CACHE_TTL_SECONDS:-60}
      PRICE_MAX_STALENESS_SECONDS: ${PRICE_MAX_STALENESS_SECONDS:-300}
      PRICE_OUTLIER_THRESHOLD_BPS: ${PRICE_OUTLIER_THRESHOLD_BPS:-500}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PORT: "3000"
    ports:
      - "3000:3000"
    command: ["/bin/sh", "-c", "./node_modules/.bin/prisma migrate deploy && node server.js"]

  # No host port: reachable only from the app over the internal compose network.
  # No monerod is bundled — point MONERO_DAEMON_ADDRESS at your own node.
  wallet-rpc:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.wallet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
    volumes:
      - wallet_data:/data

  # Development profile: COMPOSE_PROFILES=dev
  db-dev:
    image: postgres@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    profiles: ["dev"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pay}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay} -d ${POSTGRES_DB:-pay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-dev:
    profiles: ["dev"]
    image: node@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    working_dir: /app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      db-dev:
        condition: service_healthy
      wallet-rpc-dev:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pay}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db-dev:5432/${POSTGRES_DB:-pay}?schema=public
      MONERO_WALLET_RPC_URL: http://wallet-rpc-dev:18082
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:?set MONERO_WALLET_PASSWORD in .env}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-at-least-32-characters-long}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_MODE: ${MONERO_DAEMON_MODE:-full-scan}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_DAEMON_FALLBACKS: ${MONERO_DAEMON_FALLBACKS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:-dev@example.com}
      SINGLE_USER_PASSWORD: ${SINGLE_USER_PASSWORD:-dev-password-at-least-12}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-dev-payment-api-key}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      PAYMENT_REQUIRED_CONFIRMATIONS: ${PAYMENT_REQUIRED_CONFIRMATIONS:-10}
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PORT: "3001"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    command: >-
      sh -c "apk add --no-cache openssl libc6-compat &&
      npm ci &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run dev -- -H 0.0.0.0 -p 3001"

  wallet-rpc-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.wallet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
    ports:
      - "18083:18082"
    volumes:
      - wallet_data_dev:/data

  # Optional onion access: COMPOSE_PROFILES=prod,tor docker compose up
  tor:
    image: osminogin/tor-simple@sha256:46111caf16b334e556d90d504352adecba78408b68c88c2a3045e475ce857b34
    profiles: ["tor"]
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - tor_data:/var/lib/tor
      - ./tor/torrc:/etc/tor/torrc:ro
    security_opt:
      - no-new-privileges:true

  # Tor-only profile: no clearnet ports are published.
  db-onion:
    image: postgres@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    profiles: ["tor-only"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pay}
    volumes:
      - postgres_data_onion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay} -d ${POSTGRES_DB:-pay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-onion:
    profiles: ["tor-only"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      db-onion:
        condition: service_healthy
      wallet-rpc-onion:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pay}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db-onion:5432/${POSTGRES_DB:-pay}?schema=public
      MONERO_WALLET_RPC_URL: http://wallet-rpc-onion:18082
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:?set MONERO_WALLET_PASSWORD in .env}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:?set WALLET_ENCRYPTION_KEY in .env}
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_MODE: ${MONERO_DAEMON_MODE:-full-scan}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_DAEMON_FALLBACKS: ${MONERO_DAEMON_FALLBACKS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:?set SINGLE_USER_EMAIL in .env}
      SINGLE_USER_PASSWORD: ${SINGLE_USER_PASSWORD:?set SINGLE_USER_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      NODE_ENV: production
      ACCESS_MODE: tor
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PORT: "3000"
    command: ["/bin/sh", "-c", "./node_modules/.bin/prisma migrate deploy && node server.js"]

  wallet-rpc-onion:
    profiles: ["tor-only"]
    build:
      context: .
      dockerfile: Dockerfile.wallet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
    volumes:
      - wallet_data_onion:/data

  tor-onion:
    image: osminogin/tor-simple@sha256:46111caf16b334e556d90d504352adecba78408b68c88c2a3045e475ce857b34
    profiles: ["tor-only"]
    restart: unless-stopped
    depends_on:
      - app-onion
    volumes:
      - tor_data_onion:/var/lib/tor
      - ./tor/torrc-onion:/etc/tor/torrc:ro
    security_opt:
      - no-new-privileges:true

  # I2P-only profile: no clearnet ports are published.
  db-i2p:
    image: postgres@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    profiles: ["i2p-only"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    pids_limit: 200
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pay}
    volumes:
      - postgres_data_i2p:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pay} -d ${POSTGRES_DB:-pay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-i2p:
    profiles: ["i2p-only"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      db-i2p:
        condition: service_healthy
      wallet-rpc-i2p:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pay}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db-i2p:5432/${POSTGRES_DB:-pay}?schema=public
      MONERO_WALLET_RPC_URL: http://wallet-rpc-i2p:18082
      MONERO_WALLET_PASSWORD: ${MONERO_WALLET_PASSWORD:?set MONERO_WALLET_PASSWORD in .env}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:?set WALLET_ENCRYPTION_KEY in .env}
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_MODE: ${MONERO_DAEMON_MODE:-full-scan}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_DAEMON_FALLBACKS: ${MONERO_DAEMON_FALLBACKS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:?set SINGLE_USER_EMAIL in .env}
      SINGLE_USER_PASSWORD: ${SINGLE_USER_PASSWORD:?set SINGLE_USER_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      NODE_ENV: production
      ACCESS_MODE: i2p
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PORT: "3000"
    command: ["/bin/sh", "-c", "./node_modules/.bin/prisma migrate deploy && node server.js"]

  wallet-rpc-i2p:
    profiles: ["i2p-only"]
    build:
      context: .
      dockerfile: Dockerfile.wallet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    environment:
      MONERO_NETWORK: ${MONERO_NETWORK:-mainnet}
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON_ADDRESS:-}
      MONERO_DAEMON_PROXY: ${MONERO_DAEMON_PROXY:-}
      MONERO_RPC_USER: ${MONERO_RPC_USER:-monero}
      MONERO_RPC_PASSWORD: ${MONERO_RPC_PASSWORD:?set MONERO_RPC_PASSWORD in .env}
    volumes:
      - wallet_data_i2p:/data

  i2pd:
    image: purplei2p/i2pd@sha256:cb2d9af19e68e2d5b10e51d7f855454938ac426c1b3009e80242785686afe9db
    profiles: ["i2p-only"]
    restart: unless-stopped
    depends_on:
      - app-i2p
    volumes:
      - i2p_data:/home/i2pd/data
      - ./i2pd/tunnels.conf:/home/i2pd/data/tunnels.conf:ro
    command: ["--tunconf=/home/i2pd/data/tunnels.conf", "--log=stdout"]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  postgres_data_dev:
  wallet_data:
  wallet_data_dev:
  dev_node_modules:
  tor_data:
  postgres_data_onion:
  wallet_data_onion:
  tor_data_onion:
  postgres_data_i2p:
  wallet_data_i2p:
  i2p_data:
