groups:
  - name: pay
    rules:
      - alert: PayDatabaseDown
        expr: pay_db_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Postgres is unreachable

      - alert: PayWalletRpcDown
        expr: pay_wallet_rpc_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: monero-wallet-rpc is unreachable

      - alert: PayDaemonDown
        expr: pay_daemon_up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Monero daemon is unreachable

      - alert: PayWalletSyncLagHigh
        expr: pay_wallet_sync_lag_blocks > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Wallet is more than 10 blocks behind the daemon

      - alert: PayPriceSourcesDegraded
        expr: pay_price_sources_healthy < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Fewer than two XMR price sources are healthy

      - alert: PayWebhookFailures
        expr: rate(pay_webhook_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Webhook delivery failures are elevated

      - alert: PaySettlementErrors
        expr: increase(pay_settlement_errors_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Payment settlement failed

      - alert: PayRateLimitHits
        expr: rate(pay_rate_limit_hits_total[5m]) > 1
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Rate limit hits are elevated
