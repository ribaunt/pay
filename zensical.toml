[project]
site_name = "Ribaunt Pay"
site_url = "https://pay.ribaunt.com/"
site_description = "Documentation for Ribaunt Pay — a self-hosted, privacy-first Monero payment server with watch-only wallets, expiring payment links and signed webhooks."
site_author = "Ribaunt"
copyright = "&copy; 2026 Ribaunt &middot; Made with Zensical"
repo_url = "https://github.com/ribaunt/pay"
repo_name = "ribaunt/pay"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "getting-started/index.md",
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Installation" = "getting-started/installation.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ] },
  { "Guides" = [
    "guides/index.md",
    { "Docker deployment" = "guides/docker-deployment.md" },
    { "Watch-only wallet" = "guides/watch-only-wallet.md" },
    { "Payment links" = "guides/payment-links.md" },
    { "Payment proofs" = "guides/payment-proofs.md" },
    { "Webhooks" = "guides/webhooks.md" },
    { "API keys" = "guides/api-keys.md" },
    { "Backups" = "guides/backups.md" },
    { "Tor and I2P" = "guides/tor-and-i2p.md" },
    { "Monitoring" = "guides/monitoring.md" },
    { "Releases" = "guides/releases.md" },
    { "Development" = "guides/development.md" },
  ] },
  { "How it works" = [
    "architecture/index.md",
    { "Payment lifecycle" = "architecture/payment-lifecycle.md" },
    { "Privacy model" = "architecture/privacy-model.md" },
    { "Data model" = "architecture/data-model.md" },
  ] },
  { "API" = [
    "api/index.md",
    { "Authentication" = "api/authentication.md" },
    { "Health" = "api/health.md" },
    { "Payment links" = "api/payment-links.md" },
    { "Wallet" = "api/wallet.md" },
    { "Prices" = "api/prices.md" },
    { "Webhooks" = "api/webhooks.md" },
    { "Admin and metrics" = "api/admin-and-metrics.md" },
    { "Payment proofs" = "api/proofs.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Types" = "reference/types.md" },
    { "Environment variables" = "reference/environment.md" },
    { "Monero concepts" = "reference/monero-concepts.md" },
    { "Errors and limits" = "reference/errors-and-limits.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ribaunt/pay"

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "orange"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
